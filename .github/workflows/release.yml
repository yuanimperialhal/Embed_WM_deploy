name: Publish DEB release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 python3-opencv python3-pil libqt5svg5 desktop-file-utils
      - name: Unit and first-run UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
      - name: Build release and validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: /usr/bin/python3 -B packaging/release_artifacts.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Create release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Cosmos 相机助手 $RELEASE_TAG" --notes-file docs/release-notes.md --draft
          gh release upload "$RELEASE_TAG" dist/*.deb dist/*.deb.sha256 dist/*.release.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
