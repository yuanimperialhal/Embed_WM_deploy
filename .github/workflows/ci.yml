name: Build and verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 python3-opencv python3-pil libqt5svg5 desktop-file-utils
      - name: Unit and first-run UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
      - name: Build and inspect arm64 package
        run: /usr/bin/python3 -B packaging/release_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-camera-jetson-arm64
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.release.json
          if-no-files-found: error
